{{define "title"}}Sign in · Answerbox{{end}}

{{define "header"}}{{template "brand_header" .}}{{end}}

{{define "main"}}
<main class="container narrow login">

  <p><a href="/">Student? Go to the start page</a></p>
</main>
{{end}}
