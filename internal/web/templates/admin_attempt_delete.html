{{define "title"}}Delete attempt · Answerbox{{end}}

{{define "header"}}{{template "admin_header" .}}{{end}}

{{define "main"}}
<main class="container narrow delete-confirm" data-exam-id="{{.Exam.ID}}" data-attempt-id="{{.Attempt.ID}}">
  <h1>Delete attempt</h1>
  <p class="delete-question">Delete the attempt by ‘{{.Attempt.StudentName}}’? This cannot be undone.</p>
  <div class="confirm-actions">
    <form method="post" action="/admin/exams/{{.Exam.ID}}/attempts/{{.Attempt.ID}}/delete">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="danger">Delete attempt</button>
    </form>
    <a class="button secondary" href="/admin/exams/{{.Exam.ID}}/attempts">Cancel</a>
  </div>
</main>
{{end}}
