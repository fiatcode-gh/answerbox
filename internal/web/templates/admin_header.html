{{define "admin_header"}}
<header class="admin-header">
  <nav class="container" aria-label="{{t "nav.label"}}">
    <a class="brand" href="/admin/exams">{{template "mark"}}<span class="wordmark">Answerbox</span></a>
    <ul class="nav-links">
      <li><a href="/admin/exams"{{if eq .Nav "exams"}} aria-current="page"{{end}}>{{t "nav.exams"}}</a></li>
      {{if .Me.Admin}}<li><a href="/admin/teachers"{{if eq .Nav "teachers"}} aria-current="page"{{end}}>{{t "nav.teachers"}}</a></li>{{end}}
    </ul>
    <div class="account">
      <span id="signed-in-as" class="signed-in-as" title="{{.Me.Email}}">{{.Me.Email}}</span>
      <form class="logout-form" method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit" class="quiet">{{t "nav.logout"}}</button>
      </form>
    </div>
  </nav>
</header>
{{end}}
